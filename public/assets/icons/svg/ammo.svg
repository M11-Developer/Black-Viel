<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f14"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="ammoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="126" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <g filter="url(#glow)" transform="translate(128, 96)">
    <g transform="translate(0, 0)">
      <rect x="20" y="40" width="40" height="160" rx="4" fill="url(#ammoGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
      <polygon points="20,40 40,10 60,40" fill="#fcd34d" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
      <rect x="24" y="60" width="32" height="8" rx="2" fill="rgba(0,0,0,0.3)"/>
      <rect x="24" y="80" width="32" height="8" rx="2" fill="rgba(0,0,0,0.2)"/>
    </g>
    <g transform="translate(80, 20)">
      <rect x="20" y="40" width="40" height="160" rx="4" fill="url(#ammoGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
      <polygon points="20,40 40,10 60,40" fill="#fcd34d" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    </g>
    <g transform="translate(160, 0)">
      <rect x="20" y="40" width="40" height="160" rx="4" fill="url(#ammoGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
      <polygon points="20,40 40,10 60,40" fill="#fcd34d" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    </g>
  </g>
</svg>
