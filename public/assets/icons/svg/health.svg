<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f14"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="shine" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="126" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <g filter="url(#glow)" transform="translate(96, 96)">
    <path d="M160 40 C80 -20, 0 40, 160 200 C320 40, 240 -20, 160 40 Z" fill="url(#heartGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M160 40 C80 -20, 0 40, 160 200 C320 40, 240 -20, 160 40 Z" fill="url(#shine)"/>
  </g>
  <g opacity="0.08">
    <path d="M256 180 L256 380 M180 256 L332 256" stroke="#4ade80" stroke-width="1" stroke-dasharray="4 8"/>
  </g>
