  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="126" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <g filter="url(#glow)" transform="translate(128, 128)">
    <path d="M48 32 L208 128 L48 224 Z" fill="url(#playGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M48 32 L208 128 L48 224 Z" fill="url(#shine)"/>
  </g>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#playGrad)" stroke-width="2" opacity="0.15"/>
