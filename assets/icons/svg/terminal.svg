<svg width="512" height="512" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f14"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="shine" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <rect width="24" height="24" rx="6" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="23" height="23" rx="5.5" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <g filter="url(#glow)" transform="translate(0,0)">
    <rect x="2" y="3" width="20" height="14" rx="2" fill="none" stroke="url(#grad)" stroke-width="3"/><line x1="8" y1="21" x2="16" y2="21" stroke="url(#grad)" stroke-width="3" stroke-linecap="round"/><line x1="12" y1="17" x2="12" y2="21" stroke="url(#grad)" stroke-width="3"/><polyline points="7 10 10 13 7 16" fill="none" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="16" x2="17" y2="16" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>
    
  </g>
</svg>
